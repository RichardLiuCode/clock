<!DOCTYPE html>
<html>

<head>
  <style>
    * {
      font-family: arial;
      color: white;
    }

    html,
    body {
      margin: 0px;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: black;
    }

    progress {
      width: 600px;
    }

    td {
      padding: 3px;
      padding-right: 10px;
    }
  </style>
</head>

<body>
  <table>
    <tr>
      <td>
        Seasons
      </td>
      <td>
        <progress id="seasons" min="0" max="4"></progress>
      </td>
    </tr>
    <tr>
      <td>
        Month
      </td>
      <td>
        <progress id="months" min="0" max="12"></progress>
      </td>
    </tr>
    <tr>
      <td>
        Day
      </td>
      <td>
        <progress id="days" min="0" max="31"></progress>
      </td>
    </tr>
    <tr>
      <td>
        Hours
      </td>
      <td>
        <progress id="hours" min="0" max="24"></progress>
      </td>
    </tr>
    <tr>
      <td>Minutes</td>
      <td>
        <progress id="minutes" min="0" max="60"></progress>
      </td>
    </tr>
    <tr>
      <td>Seconds</td>
      <td>
        <progress id="seconds" min="0" max="60"></progress>
      </td>
    </tr>
  </table>

  <script>
    setInterval(function() {
      document.getElementById("months").value = new Date().getMonth() + 1;
      document.getElementById("days").value = new Date().getDate();
      document.getElementById("hours").value = new Date().getHours() + (new Date().getMinutes() / 60);
      document.getElementById("minutes").value = new Date().getMinutes() + (new Date().getSeconds() / 60);
      document.getElementById("seconds").value = new Date().getSeconds() + (new Date().getMilliseconds() / 1000);
      (function() {
        const m = new Date().getMonth() + 1
        if (m == 1 || m == 3 || m == 5 || m == 7 || m == 8 || m == 10 || m == 12) {
          document.getElementById("days").max = 31;
        } else if (m == 4 || m == 6 || m == 9 || m == 11) {
          document.getElementById("days").max = 30;
        } else {
          document.getElementById("days").max = 28;
        }
        if (m <= 3) {
          document.getElementById("seasons").value = 1;
        } else if (m <= 6) {
          document.getElementById("seasons").value = 2;
        } else if (m <= 9) {
          document.getElementById("seasons").value = 3;
        } else {
          document.getElementById("seasons").value = 4;
        }
      })();
    }, 10)
  </script>
</body>

</html>
