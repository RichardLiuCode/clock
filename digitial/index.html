<!DOCTYPE html>
<html>

<head>

  <title>00:00:00</title>
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/481/481774.png">
  <script src="script.js" defer></script>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="topBar">
    <div class="optionsWrapper">
      <div class="twelveAndTwentyFourHoursSwitch">
        <input type="checkbox" id="twelveAndTwentyFourHoursCheckbox">
        <div class="hoursSwitchThumb"></div>
        <label class="twelveHoursLabel">12 Hours</label>
        <label class="twentyFourHoursLabel">24 Hours</label>
      </div>

      <div class="showSecondsSwitch">
        <input type="checkbox" id="showSecondsCheckbox">
        <label class="showSecondsLabel">Show Seconds</label>
      </div>
      <div class="selectTheme">
        <button id="selectThemeButton">Theme</button>
      </div>
    </div>
  </div>
  <div class="themeOptions"></div>
  <div class="clockContainer">
    <div id="clock">00:00:00</div>
  </div>
</body>

</html>
